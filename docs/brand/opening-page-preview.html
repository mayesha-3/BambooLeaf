<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BambooLeaf opening splash (preview)</title>
<link rel="icon" href="../../frontend/public/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%}
/* Splash screen: the logo and the name, centred, like the start screen of a wallet app.
   Uses the app's own palette and fonts (see tailwind.config.js and index.css):
   slate surfaces, a lime accent, Outfit for the name.
   Dark mode follows the app's `html.dark` class, not only the operating system setting. */
.bl-landing {
  --bl-bg: #fbfbfc;
  --bl-text: #0f172a;
  --bl-accent: #65a30d;
  --bl-glow: rgba(163, 230, 53, 0.18);
  /* Logo colours: bamboo and leaf outline use the accent, the leaf is cut out in the page colour. */
  --bl-ink: var(--bl-accent);
  --bl-paper: var(--bl-bg);

  box-sizing: border-box;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  background:
    radial-gradient(34rem 28rem at 50% 45%, var(--bl-glow), transparent 70%),
    var(--bl-bg);
  color: var(--bl-text);
  cursor: pointer;
  opacity: 1;
  transition: opacity 400ms ease;
  animation: bl-splash-in 500ms ease both;
  -webkit-font-smoothing: antialiased;
}

:root.dark .bl-landing {
  --bl-bg: #080d19;
  --bl-text: #f1f5f9;
  --bl-accent: #a3e635;
  --bl-glow: rgba(132, 204, 22, 0.14);
}

.bl-landing--leaving {
  opacity: 0;
}

.bl-landing__logo {
  width: min(52vw, 11rem);
  height: auto;
  aspect-ratio: 1;
}

.bl-landing__name {
  margin: 0;
  font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
  font-size: clamp(1.75rem, 5vw, 2.5rem);
  font-weight: 900;
  letter-spacing: -0.03em;
  animation: bl-name-in 700ms cubic-bezier(0.2, 0.7, 0.2, 1) 500ms both;
}

@keyframes bl-splash-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes bl-name-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* The one moment of motion on the logo: the leaf settles onto the bamboo. */
.bl-logo__leaf--settle {
  transform-box: fill-box;
  transform-origin: center;
  animation: bl-leaf-settle 900ms cubic-bezier(0.2, 0.7, 0.2, 1) 150ms both;
}

@keyframes bl-leaf-settle {
  from {
    transform: translate(-14px, -30px) rotate(-22deg);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}

@media (prefers-reduced-motion: reduce) {
  .bl-landing,
  .bl-landing__name,
  .bl-logo__leaf--settle {
    animation: none;
  }

  .bl-landing {
    transition: none;
  }

  /* No fade-out either: stay fully visible until the app opens. */
  .bl-landing--leaving {
    opacity: 1;
  }
}
</style>
<script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark")</script>
</head><body>
<div class="bl-landing" id="splash"><svg class="bl-landing__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="BambooLeaf logo"><defs><mask id="bl-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128"><rect width="128" height="128" fill="#fff"/><g stroke="#1a1a1a" stroke-width="1.7" stroke-linecap="round"><line x1="29.7" y1="26" x2="29.7" y2="38.7"/><line x1="29.7" y1="53.3" x2="29.7" y2="66.7"/><line x1="29.7" y1="81.3" x2="29.7" y2="90.7"/><line x1="60.7" y1="12" x2="60.7" y2="28.7"/><line x1="60.7" y1="43.3" x2="60.7" y2="58.7"/><line x1="60.7" y1="73.3" x2="60.7" y2="88.7"/><line x1="60.7" y1="103.3" x2="60.7" y2="120"/><line x1="91.7" y1="32" x2="91.7" y2="44.7"/><line x1="91.7" y1="59.3" x2="91.7" y2="72.7"/><line x1="91.7" y1="87.3" x2="91.7" y2="102"/></g><g transform="translate(64 60) rotate(-10) scale(0.74) translate(-50 -50)"><polygon points="50,2 58,22 66,16 64,34 88,26 80,46 96,52 78,62 80,76 58,68 53,74 53,98 47,98 47,74 42,68 20,76 22,62 4,52 20,46 12,26 36,34 34,16 42,22" fill="#000" stroke="#000" stroke-width="10" stroke-linejoin="round"/></g></mask></defs><g fill="var(--bl-ink, #65A30D)" mask="url(#bl-cut)"><rect x="25.5" y="20" width="15" height="24.7" rx="5.5"/><rect x="25.5" y="47.3" width="15" height="25.4" rx="5.5"/><rect x="25.5" y="75.3" width="15" height="21.4" rx="5.5"/><rect x="25.5" y="99.3" width="15" height="14.7" rx="5.5"/><rect x="56.5" y="6" width="15" height="28.7" rx="5.5"/><rect x="56.5" y="37.3" width="15" height="27.4" rx="5.5"/><rect x="56.5" y="67.3" width="15" height="27.4" rx="5.5"/><rect x="56.5" y="97.3" width="15" height="28.7" rx="5.5"/><rect x="87.5" y="26" width="15" height="24.7" rx="5.5"/><rect x="87.5" y="53.3" width="15" height="25.4" rx="5.5"/><rect x="87.5" y="81.3" width="15" height="26.7" rx="5.5"/></g><g transform="translate(64 60) rotate(-10) scale(0.74) translate(-50 -50)" fill="none" stroke="var(--bl-ink, #65A30D)" stroke-linejoin="round" stroke-linecap="round"><g class="bl-logo__leaf bl-logo__leaf--settle"><polygon points="50,2 58,22 66,16 64,34 88,26 80,46 96,52 78,62 80,76 58,68 53,74 53,98 47,98 47,74 42,68 20,76 22,62 4,52 20,46 12,26 36,34 34,16 42,22" stroke-width="3.4"/><path d="M50 96 L50 18 M50 60 L25 40 M50 60 L75 40" stroke-width="2.6"/></g></g></svg><h1 class="bl-landing__name">BambooLeaf</h1></div>
<script>
// Preview only (styles copied from landing.css): the real page is React, see frontend/src/features/landing.
// Same timing as the app: 3.5 s, fade-out for the last 0.4 s, click to replay.
const SPLASH_MS = 3500, FADE_MS = 400, el = document.getElementById('splash');
function run() {
  el.classList.remove('bl-landing--leaving'); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  setTimeout(() => el.classList.add('bl-landing--leaving'), SPLASH_MS - FADE_MS);
  setTimeout(() => { document.title = 'BambooLeaf splash finished: the app opens here (click to replay)'; }, SPLASH_MS);
}
el.addEventListener('click', () => location.reload());
run();
</script></body></html>
